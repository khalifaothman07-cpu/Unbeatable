<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Record — KAZ6</title>
  <meta name="description" content="The verifiable record — 18 debate medals, 5 MUN Best Council awards, 300K+ followers, 4 strategy games shipped." />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <meta name="theme-color" content="#e2ddcc" />
  <!-- Applies a saved theme BEFORE first paint. This is a multi-page site,
       so without it a saved Dark flashes bone-white for a frame on every
       single navigation. "auto" needs no script — the CSS media query in
       tokens.css already covers it. -->
  <script>
    try {
      var t = localStorage.getItem("kaz6.theme");
      var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#181815" : "#e2ddcc");
    } catch (e) { /* storage blocked — the CSS default is a fine answer */ }
  </script>
</head>
<body>
  <div class="progress" id="progress"></div>
  <nav class="nav" id="nav"></nav>

  <header class="phero">
    <div class="wrap">
      <div class="phero-top">
        <span class="phero-status">The record</span>
        <span class="phero-loc">Verifiable · no inflation</span>
      </div>
      <h1 class="phero-title">Record</h1>
      <p class="phero-lead">Three arenas, one method — argue the case the way you build the game. Every number below is real and checkable.</p>
    </div>
  </header>

  <section class="section section--tight">
    <div class="wrap">
      <p class="eyebrow">The arenas</p>
      <h2 class="section-title">Where it was earned</h2>
      <div class="docket" data-render="arenas"></div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <p class="eyebrow">By the numbers</p>
      <h2 class="section-title">The ledger</h2>
      <div class="ledger" data-render="stats"></div>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <!-- Identity and the visit log. A module, so it defers on its own; the
       page renders exactly as it does without it if it fails to load. -->
  <script type="module" src="js/account.js"></script>
</body>
</html>
